# ================================================================
#  TrayectorIA — full stack with Docker (only Docker is required)
#
#    docker compose up --build        # db + api + web + demo data
#    open http://localhost:3000
#
#  Optional: copy .env.example to .env to set OPENAI_API_KEY or
#  GEMINI_API_KEY + AI_PROVIDER=gemini (AI
#  features), change ports, credentials or the JWT secret.
#  Stop:             docker compose down
#  Stop + wipe data: docker compose down -v
# ================================================================
name: trayectoria

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trayectoria
      POSTGRES_USER: ${DB_USERNAME:-trayectoria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trayectoria}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-trayectoria} -d trayectoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/trayectoria
      DB_USERNAME: ${DB_USERNAME:-trayectoria}
      DB_PASSWORD: ${DB_PASSWORD:-trayectoria}
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      # Base64 secret (>= 32 bytes). This default is for local demos ONLY.
      JWT_SECRET: ${JWT_SECRET:-hpMz9WlitfoQR3yfQg5wIPheyM7VjLRYUok0Tsti7jg=}
      # AI features need a real key. Without it the app still starts and
      # everything else works; only CV generation / mock interviews fail.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-not-configured}
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-not-configured}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # AI provider: openai (default) or gemini. Gemini needs GEMINI_API_KEY.
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Optional (avatars/logos upload)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Quieter logs than the default dev profile
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_COM_EDUMORA_TRAYECTORIA: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL: WARN
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # URL the browser uses to reach the API (baked in at build time)
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}/api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # One-shot job 1/2: loads fictional companies, candidates, job offers,
  # applications and saved offers through the REST API.
  # Skipped if the demo data already exists. Disable with SEED_DEMO_DATA=false
  seed:
    image: node:22-alpine
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /seed
    volumes:
      - ./seed:/seed:ro
    environment:
      API_URL: http://backend:8080/api
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    command: ["node", "seed.mjs"]
    restart: "no"

  # One-shot job 2/2: adds pre-written AI content (a tailored CV and two mock
  # interviews) directly in the database, so those screens have data even
  # without an AI key. Never fails the stack if something goes wrong.
  seed-ai:
    image: postgres:16-alpine
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./seed:/seed:ro
    environment:
      PGHOST: db
      PGDATABASE: trayectoria
      PGUSER: ${DB_USERNAME:-trayectoria}
      PGPASSWORD: ${DB_PASSWORD:-trayectoria}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "$$SEED_DEMO_DATA" = "false" ]; then echo "[seed-ai] SEED_DEMO_DATA=false → skipping."; exit 0; fi
        psql -v ON_ERROR_STOP=1 -q -f /seed/ai-demo.sql && echo "[seed-ai] AI demo content loaded." || echo "[seed-ai] WARNING: could not load AI demo content (the rest of the app is unaffected)."
    restart: "no"

volumes:
  db_data:

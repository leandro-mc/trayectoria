spring:
  application:
    name: trayectoria

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # Default to 'dev' profile if not set

  # Placeholder so the OpenAI auto-configuration can start even when OpenAI is not
  # used (e.g. AI_PROVIDER=gemini). Real calls need a real OPENAI_API_KEY.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-not-configured}

  # Timeouts for outgoing HTTP calls made with Spring's RestClient (used by the Gemini provider)
  http:
    client:
      connect-timeout: 10s
      read-timeout: 90s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: false          # logs every SQL query — disable in production
    properties:
      hibernate:
        format_sql: false    # pretty-prints the SQL in logs - disable in production

  flyway:
    enabled: ${FLYWAY_ENABLED}          # Disabled while ddl-auto=create-drop is active
    # When  ready to switch to Flyway:
    #   1. Set ddl-auto: validate
    #   2. Set enabled: true
    #   3. Flyway will run V1__init.sql automatically on startup
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

    ai:
      openai:
        api-key: ${OPENAI_API_KEY}
        chat:
          options:
            model: ${OPENAI_MODEL:gpt-4o-mini}
            max-tokens: ${OPENAI_MAX_TOKENS:2000}
            temperature: 0.7    # Creatividad moderada — 0=determinístico, 1=muy creativo

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api       # All endpoints are prefixed with /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.edumora.trayectoria.web.controller
  paths-to-match: /v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 days

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

logging:
  level:
    root: WARN
    org.flywaydb: INFO
    com.edumora.trayectoria: DEBUG
    org.springframework.security: DEBUG

# ── AI provider ──────────────────────────────────────────────────
# Which implementation of AiGenerationPort is used: openai (default) | gemini
app:
  ai:
    provider: ${AI_PROVIDER:openai}

# Used only when AI_PROVIDER=gemini
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  max-output-tokens: ${GEMINI_MAX_TOKENS:8192}
  temperature: ${GEMINI_TEMPERATURE:0.7}
